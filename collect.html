<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>좌표 수집 — GNSS 레이더</title>
<style>
  :root { --bg:#05121a; --fg:#c9f6ff; --acc:#33e1a1; --warn:#ffb454; --err:#ff5d6c; --dim:#5b7f8c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px; max-width:560px; margin:0 auto; -webkit-text-size-adjust:100%;
  }
  h1 { font-size:18px; margin:0 0 4px; color:var(--acc); }
  p.sub { margin:0 0 16px; color:var(--dim); font-size:13px; }
  .card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:6px; letter-spacing:.03em; }
  input[type=text] {
    width:100%; background:#02222b; border:1px solid #12414f; color:var(--fg);
    border-radius:8px; padding:10px; font-size:15px; font-family:ui-monospace,Menlo,monospace;
  }
  select {
    width:100%; background:#02222b; border:1px solid #12414f; color:var(--fg);
    border-radius:8px; padding:11px 10px; font-size:16px; -webkit-appearance:none; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--acc) 50%),linear-gradient(135deg,var(--acc) 50%,transparent 50%);
    background-position:calc(100% - 18px) 18px,calc(100% - 12px) 18px; background-size:6px 6px,6px 6px; background-repeat:no-repeat;
  }
  button {
    appearance:none; border:0; border-radius:10px; padding:12px 16px; font-size:15px; font-weight:600;
    background:var(--acc); color:#022; cursor:pointer; touch-action:manipulation;
  }
  button.ghost { background:transparent; color:var(--fg); border:1px solid #12414f; }
  button:disabled { opacity:.4; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1 1 auto; }
  .big { font-size:26px; font-family:ui-monospace,Menlo,monospace; color:#fff; }
  .stat { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed rgba(255,255,255,.08); }
  .stat span:first-child { color:var(--dim); }
  .out { font-family:ui-monospace,Menlo,monospace; font-size:14px; white-space:pre-wrap; word-break:break-all; background:#02222b; border-radius:8px; padding:12px; border:1px solid #12414f; }
  .acc-good { color:var(--acc); } .acc-mid { color:var(--warn); } .acc-bad { color:var(--err); }
  .bar { height:6px; border-radius:3px; background:#0a2a33; overflow:hidden; margin-top:8px; }
  .bar > i { display:block; height:100%; background:var(--acc); width:0; transition:width .3s; }
  .note { font-size:12px; color:var(--dim); margin-top:8px; }
</style>
</head>
<body>
  <h1>좌표 수집 도구</h1>
  <p class="sub">건물 정문 앞에서 30초간 수집 → 중앙값(median) 좌표를 산출합니다.<br>평균이 아닌 중앙값을 쓰는 이유: 멀티패스·이상치에 강함.</p>

  <div class="card">
    <label>수집 대상</label>
    <select id="venueSel"></select>
    <input type="text" id="labelIn" placeholder="직접 입력 (예: 자연사관 후문)" style="display:none;margin-top:8px">
  </div>

  <div class="card">
    <div class="row">
      <button id="startBtn">30초 수집 시작</button>
      <button id="stopBtn" class="ghost" disabled>중지</button>
    </div>
    <div class="bar"><i id="progBar"></i></div>
    <div class="note" id="phase">대기 중 — 하늘이 트인 곳에서 기기를 정문 위치에 두고 시작하세요.</div>
  </div>

  <div class="card">
    <div class="stat"><span>수집 샘플</span><b id="nSamples">0</b></div>
    <div class="stat"><span>현재 정확도</span><b id="curAcc">—</b></div>
    <div class="stat"><span>중앙값 정확도</span><b id="medAcc">—</b></div>
    <div style="margin-top:10px" class="big" id="medCoord">— , —</div>
  </div>

  <div class="card">
    <label>결과 (VENUES 항목에 붙여넣기)</label>
    <div class="out" id="snippet">아직 수집 전입니다.</div>
    <div class="row" style="margin-top:10px">
      <button id="copyBtn" class="ghost" disabled>복사</button>
      <button id="resetBtn" class="ghost" disabled>초기화</button>
    </div>
    <div class="note">tip: 각 건물당 2회 수집해 중앙값끼리 비교하면 신뢰도를 알 수 있습니다.</div>
  </div>

<script>
(() => {
  "use strict";
  const DURATION_MS = 30000;
  const $ = id => document.getElementById(id);
  let watchId = null, samples = [], startedAt = 0, timer = null;

  // index.html 의 VENUES 와 동일한 7개 관 (id/name 일치 유지)
  const VENUE_OPTIONS = [
    { id:"hall-nature",   name:"자연사관" },
    { id:"hall-tech",     name:"과학기술관" },
    { id:"hall-future",   name:"미래기술관" },
    { id:"hall-nari",     name:"창의나래관" },
    { id:"hall-children", name:"어린이과학관" },
    { id:"hall-bio",      name:"생물탐구관" },
    { id:"hall-astro",    name:"천체관" },
  ];
  const sel = $("venueSel");
  VENUE_OPTIONS.forEach(v => { const o = document.createElement("option"); o.value = v.id; o.textContent = v.name; sel.appendChild(o); });
  { const o = document.createElement("option"); o.value = "__custom__"; o.textContent = "기타(직접 입력)…"; sel.appendChild(o); }
  sel.onchange = () => { $("labelIn").style.display = sel.value === "__custom__" ? "block" : "none"; render(); };
  $("labelIn").oninput = render;

  const median = arr => {
    if (!arr.length) return NaN;
    const s = [...arr].sort((a, b) => a - b), m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  };
  const accClass = a => a == null ? "" : a <= 10 ? "acc-good" : a <= 25 ? "acc-mid" : "acc-bad";
  const fmtAcc = a => a == null ? "—" : `±${a.toFixed(0)} m`;

  function render() {
    const n = samples.length;
    $("nSamples").textContent = n;
    if (!n) return;
    const last = samples[n - 1];
    $("curAcc").innerHTML = `<span class="${accClass(last.acc)}">${fmtAcc(last.acc)}</span>`;
    const mLat = median(samples.map(s => s.lat));
    const mLng = median(samples.map(s => s.lng));
    const mAcc = median(samples.map(s => s.acc));
    $("medAcc").innerHTML = `<span class="${accClass(mAcc)}">${fmtAcc(mAcc)}</span>`;
    $("medCoord").textContent = `${mLat.toFixed(6)} , ${mLng.toFixed(6)}`;
    const meta = `// 샘플 ${n}개 · 중앙값 정확도 ±${mAcc.toFixed(0)}m · 수집 ${new Date().toISOString()}`;
    const sv = VENUE_OPTIONS.find(v => v.id === sel.value);
    if (sv) {
      // 선택한 관: index.html VENUES 의 해당 항목 lat/lng 만 아래 값으로 교체
      $("snippet").textContent =
`// ${sv.name} (${sv.id}) — VENUES 해당 항목의 lat/lng 를 아래로 교체
  lat: ${mLat.toFixed(6)}, lng: ${mLng.toFixed(6)},
${meta}`;
    } else {
      const label = ($("labelIn").value || "unnamed").trim();
      $("snippet").textContent =
`{ id: "TODO-id", name: "${label}",
  lat: ${mLat.toFixed(6)}, lng: ${mLng.toFixed(6)},
  radiusIn: 30, mapImage: "maps/TODO.png" },
${meta}`;
    }
  }

  function finish(reason) {
    if (watchId != null) navigator.geolocation.clearWatch(watchId), watchId = null;
    if (timer) clearInterval(timer), timer = null;
    $("startBtn").disabled = false;
    $("stopBtn").disabled = true;
    $("copyBtn").disabled = $("resetBtn").disabled = samples.length === 0;
    $("phase").textContent = reason;
    $("progBar").style.width = "100%";
  }

  $("startBtn").onclick = () => {
    if (!("geolocation" in navigator)) { $("phase").textContent = "이 브라우저는 Geolocation을 지원하지 않습니다."; return; }
    samples = []; startedAt = Date.now();
    $("startBtn").disabled = true; $("stopBtn").disabled = false;
    $("copyBtn").disabled = $("resetBtn").disabled = true;
    $("phase").textContent = "수집 중… 움직이지 말고 대기하세요.";
    watchId = navigator.geolocation.watchPosition(
      pos => {
        samples.push({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy });
        render();
      },
      err => finish("오류: " + err.message + " (위치 권한을 허용했는지 확인)"),
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );
    timer = setInterval(() => {
      const p = Math.min(1, (Date.now() - startedAt) / DURATION_MS);
      $("progBar").style.width = (p * 100) + "%";
      if (p >= 1) finish(`완료 — 샘플 ${samples.length}개 수집. 중앙값을 복사하세요.`);
    }, 200);
  };

  $("stopBtn").onclick = () => finish(`중지됨 — 샘플 ${samples.length}개.`);
  $("resetBtn").onclick = () => {
    samples = []; $("progBar").style.width = "0";
    $("nSamples").textContent = "0"; $("curAcc").textContent = $("medAcc").textContent = "—";
    $("medCoord").textContent = "— , —"; $("snippet").textContent = "아직 수집 전입니다.";
    $("copyBtn").disabled = $("resetBtn").disabled = true;
    $("phase").textContent = "초기화됨.";
  };
  $("copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText($("snippet").textContent); $("copyBtn").textContent = "복사됨 ✓";
      setTimeout(() => $("copyBtn").textContent = "복사", 1500); }
    catch { const r = document.createRange(); r.selectNode($("snippet")); getSelection().removeAllRanges(); getSelection().addRange(r); }
  };
})();
</script>
</body>
</html>
